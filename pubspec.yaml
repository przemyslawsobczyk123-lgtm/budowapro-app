name: budowapro
description: "Local-first manager for home construction and renovation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: 4.0.9
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  file_picker: 11.0.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  google_mlkit_document_scanner: 0.5.0
  google_mlkit_text_recognition: 0.16.0
  go_router: ^17.3.0
  image: ^4.9.1
  intl: any
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: 3.13.0
  pdfrx: ^2.4.7
  share_plus: ^12.0.2
  sqflite: ^2.4.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
