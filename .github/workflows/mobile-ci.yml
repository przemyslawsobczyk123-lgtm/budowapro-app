name: BudowaPRO mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  quality:
    name: Dart analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          set +e
          flutter test --concurrency=1 --reporter expanded 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Annotate test failure
        if: failure()
        shell: bash
        run: |
          while IFS= read -r line; do
            echo "::error file=test-output.log::$line"
          done < <(grep -m 1 -E -- ' -1:|Some tests failed' test-output.log)

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budowapro-test-report
          path: test-output.log
          if-no-files-found: error

  android:
    name: Android debug APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budowapro-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned compile
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        working-directory: ios
        run: pod install

      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: budowapro-ios-debug-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
