<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BudowaPRO feature graphic</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1024px;
        height: 500px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-columns: 360px 1fr;
        align-items: center;
        background: #f3f7f5;
        color: #17211d;
        font-family: Inter, Arial, sans-serif;
      }

      .visual {
        height: 100%;
        display: grid;
        place-items: center;
        background: #073f36;
        border-right: 10px solid #f2b705;
      }

      .visual img {
        width: 242px;
        height: 242px;
        border-radius: 34px;
        box-shadow: 0 20px 44px rgb(0 0 0 / 28%);
      }

      .copy {
        padding: 48px 62px;
      }

      .name {
        margin: 0;
        font-size: 66px;
        font-weight: 800;
        line-height: 1;
      }

      .message {
        max-width: 560px;
        margin: 28px 0 0;
        font-size: 31px;
        font-weight: 650;
        line-height: 1.24;
      }

      .features {
        margin: 34px 0 0;
        color: #006c58;
        font-size: 20px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <div class="visual">
      <img src="../../site/assets/budowapro-icon.png" alt="" />
    </div>
    <main class="copy">
      <h1 class="name">BudowaPRO</h1>
      <p class="message">
        Budżet, etapy i dokumentacja budowy w jednym miejscu.
      </p>
      <p class="features">Koszty · OCR · Checklisty · Zdjęcia</p>
    </main>
  </body>
</html>
